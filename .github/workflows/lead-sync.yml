name: BAS Lead Sync + Telegram

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sync new leads & send Telegram
        run: |
          node -e "
          const OLD_BASE='appdyFH6v4quVvF4z', OLD_TABLE='tbl6p9tWbl5keMvrI';
          const NEW_BASE='app1Bh2Ny6eqTERqA', NEW_TABLE='tblaDj4M0Tlq2IRQu';
          const AIRTABLE_KEY=process.env.AIRTABLE_API_KEY;
          const TG_TOKEN=process.env.TELEGRAM_BOT_TOKEN;
          const TG_CHAT='-1003394139746';

          function norm(p){let c=(p||'').replace(/\D/g,'');if(c.startsWith('82')&&c.length>10)c='0'+c.slice(2);return c}
          function fmtDate(d){return d?(d.split('T')[0]):new Date().toISOString().split('T')[0]}

          async function main(){
            // 1. 구 테이블에서 최근 15분 내 레코드 조회
            const since=new Date(Date.now()-15*60*1000).toISOString();
            const formula=encodeURIComponent(\"IS_AFTER(CREATED_TIME(),'\"+since+\"')\");
            const oldUrl='https://api.airtable.com/v0/'+OLD_BASE+'/'+OLD_TABLE+'?filterByFormula='+formula+'&pageSize=50';
            const oldRes=await fetch(oldUrl,{headers:{Authorization:'Bearer '+AIRTABLE_KEY}});
            const oldData=await oldRes.json();
            const newRecs=oldData.records||[];

            if(newRecs.length===0){console.log('No new leads');return}
            console.log('New leads in old table: '+newRecs.length);

            // 2. 신 테이블에서 연락처 중복 체크
            for(const r of newRecs){
              const f=r.fields;
              const phone=norm(f['연락처']||'');
              if(!phone){console.log('Skip: no phone');continue}

              // 신 테이블에서 같은 연락처 검색
              const searchFormula=encodeURIComponent(\"FIND('\"+phone+\"',SUBSTITUTE({연락처},\\\"-\\\",\\\"\\\"))>0\");
              const searchUrl='https://api.airtable.com/v0/'+NEW_BASE+'/'+NEW_TABLE+'?filterByFormula='+searchFormula+'&pageSize=1&sort%5B0%5D%5Bfield%5D=%EC%A0%91%EC%88%98%EC%9D%BC&sort%5B0%5D%5Bdirection%5D=desc';
              const searchRes=await fetch(searchUrl,{headers:{Authorization:'Bearer '+AIRTABLE_KEY}});
              const searchData=await searchRes.json();
              const existing=searchData.records&&searchData.records[0];

              const name=f['이름']||'';
              const date=fmtDate(f['접수일']);
              const campaign=f['캠페인네임']||'';
              const platform=f['플랫폼']||'';
              const seminarDate=f['신청일']||'';

              const DASH='https://report.polarad.co.kr/?client=bas';

              if(existing){
                // 재접수: submission_count 증가
                const ef=existing.fields;
                const cnt=(ef.submission_count||1)+1;
                const hist=(ef.submission_history||'')+('\\n'+cnt+'차: '+date);
                await fetch('https://api.airtable.com/v0/'+NEW_BASE+'/'+NEW_TABLE+'/'+existing.id,{
                  method:'PATCH',
                  headers:{Authorization:'Bearer '+AIRTABLE_KEY,'Content-Type':'application/json'},
                  body:JSON.stringify({fields:{status:'접수',submission_count:cnt,submission_history:hist,previous_status:ef.status||'',previous_staff:ef.assigned_staff||'',previous_date:date,'참석희망일':seminarDate,last_updated_by:'sync'}})
                });
                console.log('Updated (resubmission '+cnt+'): '+name+' '+phone);

                // 텔레그램: 재접수
                const tgText='<b>[BAS 리드 재접수 ('+cnt+'회차)]</b>\\n이름: '+name+'\\n연락처: '+phone+(seminarDate?'\\n참석희망일: '+seminarDate:'')+(campaign?'\\n광고명: '+campaign:'')+'\\n접수일: '+date+'\\n\\n<a href=\"'+DASH+'\">리드관리 바로가기</a>';
                await fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT,text:tgText,parse_mode:'HTML',disable_web_page_preview:true})});
              } else {
                // 신규
                await fetch('https://api.airtable.com/v0/'+NEW_BASE+'/'+NEW_TABLE,{
                  method:'POST',
                  headers:{Authorization:'Bearer '+AIRTABLE_KEY,'Content-Type':'application/json'},
                  body:JSON.stringify({fields:{'이름':name,'연락처':f['연락처']||'','접수일':date,'참석희망일':seminarDate,status:'접수',submission_count:1,first_submission_date:date,source:'make_sync',campaign:campaign,platform:platform}})
                });
                console.log('Created: '+name+' '+phone);

                // 텔레그램: 신규
                const tgText='<b>[BAS 리드 신규]</b>\\n이름: '+name+'\\n연락처: '+phone+(seminarDate?'\\n참석희망일: '+seminarDate:'')+(campaign?'\\n광고명: '+campaign:'')+(platform?'\\n플랫폼: '+(platform==='fb'?'Facebook':platform==='ig'?'Instagram':platform):'')+'\\n접수일: '+date+'\\n\\n<a href=\"'+DASH+'\">리드관리 바로가기</a>';
                await fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT,text:tgText,parse_mode:'HTML',disable_web_page_preview:true})});
              }
            }
            console.log('Sync complete');
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          "
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
